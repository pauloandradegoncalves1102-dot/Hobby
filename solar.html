<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
canvas { display: block; }

#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#ui > * { pointer-events: auto; }

#top-bar {
  position: absolute; top: 0; left: 0; right: 0;
  background: rgba(10,10,30,0.85); backdrop-filter: blur(10px);
  padding: 10px 20px; display: flex; align-items: center; gap: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
#top-bar h1 { font-size: 18px; color: #FFD700; margin-right: 20px; white-space: nowrap; }
#top-bar button {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  transition: background 0.2s;
}
#top-bar button:hover { background: rgba(255,255,255,0.25); }
#top-bar button.active { background: #FFD700; color: #000; }
#speed-control { display: flex; align-items: center; gap: 8px; margin-left: auto; }
#speed-control label { font-size: 12px; color: #aaa; }
#speed-slider { width: 100px; accent-color: #FFD700; }
#speed-val { font-size: 12px; color: #FFD700; min-width: 40px; }

#sidebar {
  position: absolute; top: 60px; left: 0; bottom: 0; width: 180px;
  background: rgba(10,10,30,0.85); backdrop-filter: blur(10px);
  border-right: 1px solid rgba(255,255,255,0.1);
  overflow-y: auto; padding: 10px;
}
#sidebar h3 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.planet-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: 1px solid transparent; color: #ccc;
  padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
  transition: all 0.2s; margin-bottom: 4px;
}
.planet-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
.planet-btn.active { background: rgba(255,215,0,0.15); border-color: #FFD700; color: #FFD700; }
.planet-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }

#info-panel {
  position: absolute; top: 60px; right: 0; width: 320px;
  background: rgba(10,10,30,0.9); backdrop-filter: blur(10px);
  border-left: 1px solid rgba(255,255,255,0.1);
  padding: 20px; overflow-y: auto; max-height: calc(100vh - 60px);
  transform: translateX(100%); transition: transform 0.3s ease;
}
#info-panel.visible { transform: translateX(0); }
#info-panel h2 { font-size: 24px; color: #FFD700; margin-bottom: 12px; }
#info-panel .close-btn {
  position: absolute; top: 10px; right: 10px; background: none; border: none;
  color: #888; font-size: 20px; cursor: pointer;
}
#info-panel .close-btn:hover { color: #fff; }
.info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
.info-row .label { color: #888; }
.info-row .value { color: #fff; text-align: right; }
#info-panel .facts { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
#info-panel .facts h4 { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; }
#info-panel .facts p { font-size: 13px; color: #ccc; line-height: 1.5; margin-bottom: 8px; }

#controls-hint {
  position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
  font-size: 12px; color: #888; white-space: nowrap;
}

@media (max-width: 768px) {
  #sidebar { width: 140px; }
  #info-panel { width: 260px; }
  #top-bar h1 { font-size: 14px; }
}
</style>
</head>
<body>
<div id="ui">
  <div id="top-bar">
    <h1>🌌 Solar System</h1>
    <button id="btn-play" class="active" onclick="togglePlay()">⏸ Pause</button>
    <button id="btn-orbits" class="active" onclick="toggleOrbits()">Orbitas</button>
    <button id="btn-labels" class="active" onclick="toggleLabels()">Labels</button>
    <div id="speed-control">
      <label>Velocidade</label>
      <input type="range" id="speed-slider" min="1" max="500" value="50" oninput="updateSpeed()">
      <span id="speed-val">50x</span>
    </div>
  </div>

  <div id="sidebar">
    <h3>Corpos Celestes</h3>
    <button class="planet-btn" onclick="flyTo('sun')"><span class="planet-dot" style="background:#FFD700"></span>Sol</button>
    <button class="planet-btn" onclick="flyTo('mercury')"><span class="planet-dot" style="background:#b5b5b5"></span>Mercurio</button>
    <button class="planet-btn" onclick="flyTo('venus')"><span class="planet-dot" style="background:#e8c56d"></span>Venus</button>
    <button class="planet-btn" onclick="flyTo('earth')"><span class="planet-dot" style="background:#4a90d9"></span>Terra</button>
    <button class="planet-btn" onclick="flyTo('mars')"><span class="planet-dot" style="background:#d46030"></span>Marte</button>
    <button class="planet-btn" onclick="flyTo('jupiter')"><span class="planet-dot" style="background:#d4a56a"></span>Jupiter</button>
    <button class="planet-btn" onclick="flyTo('saturn')"><span class="planet-dot" style="background:#f0d58c"></span>Saturno</button>
    <button class="planet-btn" onclick="flyTo('uranus')"><span class="planet-dot" style="background:#7de8e8"></span>Urano</button>
    <button class="planet-btn" onclick="flyTo('neptune')"><span class="planet-dot" style="background:#4a6fd4"></span>Netuno</button>
    <button class="planet-btn" onclick="flyTo('pluto')"><span class="planet-dot" style="background:#c4a882"></span>Plutao</button>
  </div>

  <div id="info-panel">
    <button class="close-btn" onclick="closeInfo()">✕</button>
    <h2 id="info-name"></h2>
    <div id="info-body"></div>
    <div class="facts">
      <h4>Curiosidades</h4>
      <div id="info-facts"></div>
    </div>
  </div>

  <div id="controls-hint">🖱️ Arrastar: rotacionar | Scroll: zoom | Clique: selecionar</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PLANETS = {
  sun: { name: "Sol", radius: 20, orbit: 0, period: 0, color: 0xFFD700, diameter: "1.392.700 km", dist: "0 km", temp: "5.500°C", moons: 0, atmo: "H, He", facts: ["O Sol contém 99,86% de toda a massa do Sistema Solar.", "A luz do Sol leva ~8 minutos para chegar à Terra.", "O Sol é uma estrela anã amarela (G2V)."] },
  mercury: { name: "Mercúrio", radius: 3, orbit: 40, period: 0.24, color: 0xb5b5b5, diameter: "4.879 km", dist: "57,9 mi km", temp: "167°C", moons: 0, atmo: "Quase nula", facts: ["Um dia em Mercúrio (rotação) dura mais que seu ano (translação).", "Tem variações de temperatura de 600°C entre dia e noite.", "É o menor planeta do Sistema Solar."] },
  venus: { name: "Vênus", radius: 5, orbit: 60, period: 0.615, color: 0xe8c56d, diameter: "12.104 km", dist: "108,2 mi km", temp: "462°C", moons: 0, atmo: "CO₂, N₂", facts: ["Gira em sentido contrário à maioria dos planetas.", "É o planeta mais quente por causa do efeito estufa extremo.", "O dia venusiano é mais longo que seu ano."] },
  earth: { name: "Terra", radius: 5, orbit: 85, period: 1, color: 0x4a90d9, diameter: "12.742 km", dist: "149,6 mi km", temp: "15°C", moons: 1, atmo: "N₂, O₂, Ar", facts: ["Único planeta conhecido com vida.", "71% da superfície é coberta por água.", "O campo magnético protege da radiação solar."] },
  mars: { name: "Marte", radius: 4, orbit: 115, period: 1.88, color: 0xd46030, diameter: "6.779 km", dist: "227,9 mi km", temp: "-65°C", moons: 2, atmo: "CO₂, Ar, N₂", facts: ["Tem o maior vulcão do Sistema Solar (Olympus Mons).", "O pôr do sol em Marte é azul.", "Possível presença de água líquida no passado."] },
  jupiter: { name: "Júpiter", radius: 14, orbit: 160, period: 11.86, color: 0xd4a56a, diameter: "139.820 km", dist: "778,5 mi km", temp: "-110°C", moons: 95, atmo: "H, He", facts: ["A Grande Mancha Vermelha é uma tempestade maior que a Terra.", "É o maior planeta — cabem 1.300 Terras dentro.", "Tem o campo magnético mais forte entre os planetas."] },
  saturn: { name: "Saturno", radius: 12, orbit: 210, period: 29.46, color: 0xf0d58c, diameter: "116.460 km", dist: "1.434 mi km", temp: "-140°C", moons: 146, atmo: "H, He", facts: ["Seus anéis são feitos de gelo e rocha.", "É o planeta menos denso — flutuaria na água.", "Tem mais luas confirmadas que qualquer outro corpo."] },
  uranus: { name: "Urano", radius: 8, orbit: 260, period: 84.01, color: 0x7de8e8, diameter: "50.724 km", dist: "2.871 mi km", temp: "-195°C", moons: 28, atmo: "H, He, CH₄", facts: ["Gira praticamente deitado (inclinação de 98°).", "O metano na atmosfera dá a cor azul-esverdeada.", "Foi o primeiro planeta descoberto com telescópio (1781)."] },
  neptune: { name: "Netuno", radius: 8, orbit: 310, period: 164.8, color: 0x4a6fd4, diameter: "49.244 km", dist: "4.495 mi km", temp: "-200°C", moons: 16, atmo: "H, He, CH₄", facts: ["Tem os ventos mais rápidos do Sistema Solar (2.100 km/h).", "Foi descoberto por cálculos matemáticos antes de ser visto.", "Um ano em Netuno dura 165 anos terrestres."] },
  pluto: { name: "Plutão", radius: 2, orbit: 360, period: 248, color: 0xc4a882, diameter: "2.377 km", dist: "5.906 mi km", temp: "-225°C", moons: 5, atmo: "N₂, CH₄", facts: ["Reclassificado como planeta anão em 2006.", "Tem uma lua (Caronte) quase do tamanho dele.", "Tem uma superfície com corações de nitrogênio congelado."] }
};

let scene, camera, renderer, clock;
let playing = true, showOrbits = true, showLabels = true;
let speedMultiplier = 50;
let planets = {}, orbitLines = {}, labels = {};
let selectedPlanet = null;
let flyToTarget = null, flyToProgress = 0;
let raycaster, mouse;

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 120, 250);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // Stars
  createStars();

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x333333);
  scene.add(ambientLight);
  const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
  sunLight.position.set(0, 0, 0);
  scene.add(sunLight);

  // Create planets
  for (let key in PLANETS) {
    const data = PLANETS[key];
    createPlanet(key, data);
  }

  // Orbit controls (simple)
  let isDragging = false, prevX = 0, prevY = 0;
  let camTheta = 0, camPhi = Math.PI / 4, camRadius = 280;

  renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
  renderer.domElement.addEventListener('mouseup', () => isDragging = false);
  renderer.domElement.addEventListener('mouseleave', () => isDragging = false);
  renderer.domElement.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    camTheta -= dx * 0.005;
    camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi - dy * 0.005));
    prevX = e.clientX; prevY = e.clientY;
    updateCamera();
  });
  renderer.domElement.addEventListener('wheel', e => {
    camRadius = Math.max(20, Math.min(600, camRadius + e.deltaY * 0.3));
    updateCamera();
  });

  // Touch support
  let lastTouchDist = 0;
  renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
    if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
  });
  renderer.domElement.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      const dx = e.touches[0].clientX - prevX, dy = e.touches[0].clientY - prevY;
      camTheta -= dx * 0.005;
      camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi - dy * 0.005));
      prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
      updateCamera();
    }
    if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      camRadius = Math.max(20, Math.min(600, camRadius - (dist - lastTouchDist) * 0.5));
      lastTouchDist = dist;
      updateCamera();
    }
  });
  renderer.domElement.addEventListener('touchend', () => isDragging = false);

  // Click to select
  renderer.domElement.addEventListener('click', e => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const meshes = Object.values(planets).map(p => p.mesh);
    const intersects = raycaster.intersectObjects(meshes);
    if (intersects.length > 0) {
      const name = intersects[0].object.userData.name;
      flyTo(name);
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function updateCamera() {
    if (flyToTarget) return;
    camera.position.x = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
    camera.position.y = camRadius * Math.cos(camPhi);
    camera.position.z = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
    camera.lookAt(0, 0, 0);
  }
}

function createStars() {
  const geo = new THREE.BufferGeometry();
  const positions = [];
  for (let i = 0; i < 8000; i++) {
    const r = 800 + Math.random() * 500;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
}

function createPlanet(key, data) {
  const geo = new THREE.SphereGeometry(data.radius, 32, 32);
  const mat = new THREE.MeshPhongMaterial({ color: data.color, shininess: 10 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.name = key;
  scene.add(mesh);

  // Saturn rings
  if (key === 'saturn') {
    const ringGeo = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.2, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xc8b87a, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.3;
    mesh.add(ring);
  }

  // Earth atmosphere glow
  if (key === 'earth') {
    const glowGeo = new THREE.SphereGeometry(data.radius * 1.15, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.15 });
    mesh.add(new THREE.Mesh(glowGeo, glowMat));
  }

  // Orbit line
  if (data.orbit > 0) {
    const points = [];
    for (let i = 0; i <= 128; i++) {
      const angle = (i / 128) * Math.PI * 2;
      points.push(new THREE.Vector3(Math.cos(angle) * data.orbit, 0, Math.sin(angle) * data.orbit));
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x444466, transparent: true, opacity: 0.5 });
    const line = new THREE.Line(lineGeo, lineMat);
    scene.add(line);
    orbitLines[key] = line;
  }

  // Label
  const canvas2d = document.createElement('canvas');
  canvas2d.width = 128; canvas2d.height = 32;
  const ctx2d = canvas2d.getContext('2d');
  ctx2d.font = '16px Arial';
  ctx2d.fillStyle = '#fff';
  ctx2d.textAlign = 'center';
  ctx2d.fillText(data.name, 64, 20);
  const tex = new THREE.CanvasTexture(canvas2d);
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.8 });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(20, 5, 1);
  scene.add(sprite);
  labels[key] = sprite;

  planets[key] = { mesh, data, angle: Math.random() * Math.PI * 2 };
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (playing) {
    for (let key in planets) {
      const p = planets[key];
      if (p.data.orbit > 0) {
        p.angle += (dt * speedMultiplier * 0.01) / p.data.period;
        p.mesh.position.x = Math.cos(p.angle) * p.data.orbit;
        p.mesh.position.z = Math.sin(p.angle) * p.data.orbit;
      }
      p.mesh.rotation.y += dt * 0.5;
      if (labels[key]) {
        labels[key].position.copy(p.mesh.position);
        labels[key].position.y += p.data.radius + 5;
        labels[key].visible = showLabels;
      }
    }
  }

  // Fly-to animation
  if (flyToTarget) {
    flyToProgress += dt * 1.5;
    if (flyToProgress >= 1) {
      flyToProgress = 1;
      flyToTarget = null;
    }
    const target = planets[flyToTarget || selectedPlanet];
    if (target) {
      const t = flyToTarget ? flyToProgress : 1;
      const ease = 1 - Math.pow(1 - t, 3);
      const targetPos = target.mesh.position;
      const camDist = target.data.radius * 5 + 10;
      camera.position.lerpVectors(camera.position, new THREE.Vector3(
        targetPos.x + camDist * Math.cos(0.5),
        targetPos.y + camDist * 0.4,
        targetPos.z + camDist * Math.sin(0.5)
      ), ease * 0.1);
      camera.lookAt(targetPos);
    }
  }

  renderer.render(scene, camera);
}

function flyTo(key) {
  selectedPlanet = key;
  flyToTarget = key;
  flyToProgress = 0;
  showInfo(key);
  document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('.planet-btn');
  const idx = Object.keys(PLANETS).indexOf(key);
  if (btns[idx]) btns[idx].classList.add('active');
}

function showInfo(key) {
  const d = PLANETS[key];
  document.getElementById('info-name').textContent = d.name;
  document.getElementById('info-body').innerHTML = `
    <div class="info-row"><span class="label">Diâmetro</span><span class="value">${d.diameter}</span></div>
    <div class="info-row"><span class="label">Dist. do Sol</span><span class="value">${d.dist}</span></div>
    <div class="info-row"><span class="label">Período orbital</span><span class="value">${d.period ? d.period + ' anos' : '—'}</span></div>
    <div class="info-row"><span class="label">Temp. média</span><span class="value">${d.temp}</span></div>
    <div class="info-row"><span class="label">Luas</span><span class="value">${d.moons}</span></div>
    <div class="info-row"><span class="label">Atmosfera</span><span class="value">${d.atmo}</span></div>
  `;
  document.getElementById('info-facts').innerHTML = d.facts.map(f => `<p>• ${f}</p>`).join('');
  document.getElementById('info-panel').classList.add('visible');
}

function closeInfo() {
  document.getElementById('info-panel').classList.remove('visible');
  selectedPlanet = null;
  document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
}

function togglePlay() {
  playing = !playing;
  document.getElementById('btn-play').textContent = playing ? '⏸ Pause' : '▶ Play';
  document.getElementById('btn-play').classList.toggle('active', playing);
}

function toggleOrbits() {
  showOrbits = !showOrbits;
  Object.values(orbitLines).forEach(l => l.visible = showOrbits);
  document.getElementById('btn-orbits').classList.toggle('active', showOrbits);
}

function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-labels').classList.toggle('active', showLabels);
}

function updateSpeed() {
  speedMultiplier = parseInt(document.getElementById('speed-slider').value);
  document.getElementById('speed-val').textContent = speedMultiplier + 'x';
}
</script>
</body>
</html>
