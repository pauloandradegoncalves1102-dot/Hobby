<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor 3D Nativo - Sem Dependências</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0d13;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            background-color: #11141d;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;
        const vertices = [
            {x: -1, y: -1, z: -1}, {x: 1, y: -1, z: -1}, {x: 1, y: 1, z: -1}, {x: -1, y: 1, z: -1},
            {x: -1, y: -1, z: 1},  {x: 1, y: -1, z: 1},  {x: 1, y: 1, z: 1},  {x: -1, y: 1, z: 1}
        ];
        const faces = [
            { indices: [0, 1, 2, 3], color: "#ff4136" }, // Trás
            { indices: [1, 5, 6, 2], color: "#0074d9" }, // Direita
            { indices: [5, 4, 7, 6], color: "#2ecc40" }, // Frente
            { indices: [4, 0, 3, 7], color: "#ffdc00" }, // Esquerda
            { indices: [4, 5, 1, 0], color: "#b10dc9" }, // Topo
            { indices: [3, 2, 6, 7], color: "#01ff70" }  // Fundo
        ];
        let angleX = 0.01;
        let angleY = 0.015;
        function project(vertex) {
            const fov = 400;         
            const viewerDistance = 4; 
            const factor = fov / (viewerDistance + vertex.z);
            const x2d = vertex.x * factor + width / 2;
            const y2d = vertex.y * factor + height / 2;
            return { x: x2d, y: y2d, z: vertex.z };
        }
        function update() {
            ctx.clearRect(0, 0, width, height);
            const radX = angleX;
            const radY = angleY;
            const cosX = Math.cos(radX), sinX = Math.sin(radX);
            const cosY = Math.cos(radY), sinY = Math.sin(radY);
            const transformedVertices = vertices.map(v => {
                // Rotação no eixo Y
                let x1 = v.x * cosY - v.z * sinY;
                let z1 = v.x * sinY + v.z * cosY;
                let y2 = v.y * cosX - z1 * sinX;
                let z2 = v.y * sinX + z1 * cosX;
                return project({ x: x1, y: y2, z: z2 });
            });
            faces.forEach(face => {
                face.avgZ = (
                    transformedVertices[face.indices[0]].z +
                    transformedVertices[face.indices[1]].z +
                    transformedVertices[face.indices[2]].z +
                    transformedVertices[face.indices[3]].z
                ) / 4;
            });
            faces.sort((a, b) => b.avgZ - a.avgZ);
            faces.forEach(face => {
                ctx.beginPath();
                ctx.moveTo(transformedVertices[face.indices[0]].x, transformedVertices[face.indices[0]].y);
                for (let i = 1; i < 4; i++) {
                    ctx.lineTo(transformedVertices[face.indices[i]].x, transformedVertices[face.indices[i]].y);
                }
                ctx.closePath();
                ctx.fillStyle = face.color;
                ctx.fill();
                ctx.strokeStyle = "#11141d";
                ctx.lineWidth = 2;
                ctx.stroke();
            });
            angleX += 0.01;
            angleY += 0.013;
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
