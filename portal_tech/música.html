<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nexus - Conservatório Sinfônico</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg: #050508; --panel: rgba(14, 11, 26, 0.96); --neon-purple: #bd00ff; --text-main: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text-main); padding: 140px 8% 60px 8%; background-image: linear-gradient(180deg, #0e071a 0%, #050508 100%); }
        nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(4,5,8,0.95); border-bottom: 1px solid rgba(0,240,255,0.15); display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 22px; color: #00f0ff; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { color: #64748b; text-decoration: none; font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; }
        .nav-links a.active { color: #00f0ff; }
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .box { background: var(--panel); border: 1px solid rgba(189,0,255,0.2); padding: 30px; border-radius: 8px; }
        h2, h3 { font-family: 'Orbitron', sans-serif; color: var(--neon-purple); margin-bottom: 15px; }
        .grid-inst { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card-inst { background: #110d21; border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 6px; text-align: center; cursor: pointer; transition: 0.3s; }
        .card-inst:hover { border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(189,0,255,0.2); }
        .card-inst i { font-size: 30px; color: var(--neon-purple); margin-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; text-align: left; }
        .form-group label { font-family: 'Rajdhani', sans-serif; font-size: 14px; color: #64748b; }
        .form-group input, .form-group select { padding: 10px; background: #06040c; border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 4px; }
        .btn-sub { width: 100%; background: var(--neon-purple); color: white; border: none; padding: 12px; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; box-shadow: 0 0 10px var(--neon-purple); }
    </style>
</head>
<body>
    <nav>
        <div class="logo">NEXUS.HUB</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="programação.html">Programação</a></li>
            <li><a href="música.html" class="active">Música</a></li>
            <li><a href="infraestrutura.html">Infraestrutura</a></li>
        </ul>
    </nav>

    <div class="split">
        <div class="box">
            <h2>Teoria Musical Unificada</h2>
            <p style="color:#94a3b8; font-size:14px; margin-bottom:15px;">Matriz curricular obrigatória do básico ao avançado abrangendo leitura em múltiplas claves e harmonia.</p>
            <form onsubmit="alert('Inscrição efetuada na classe de Teoria Musical.'); this.reset(); return false;">
                <div class="form-group"><label>Nome do Aluno</label><input type="text" required></div>
                <div class="form-group"><label>WhatsApp</label><input type="text" required></div>
                <button type="submit" class="btn-sub">Efetuar Matrícula Teórica</button>
            </form>
        </div>
        <div class="box" id="painel-interativo" style="display: none;">
            <h3 id="inst-nome">Instrumento</h3>
            <div class="form-group"><label>Afinação Regulada</label><select id="inst-afinacao"></select></div>
            <div class="form-group"><label>Tipo/Modelo</label><select id="inst-tipo"></select></div>
            <div id="aviso-proprio" style="color:#ff0055; font-size:12px; margin-bottom:15px; font-weight:bold;"></div>
            <form onsubmit="alert('Matrícula de Instrumento consolidada com sucesso e salva em Excel.'); return false;">
                <div class="form-group"><label>Seu Nome</label><input type="text" required></div>
                <div class="form-group"><label>CPF do Responsável</label><input type="text" required placeholder="11 dígitos"></div>
                <button type="submit" class="btn-sub">Confirmar Inscrição Prática</button>
            </form>
        </div>
    </div>

    <h2>Selecione o Instrumento Acadêmico</h2>
    <div class="grid-inst" id="grid"></div>

    <script>
        const insts = [
            { nome: "Violino", afs: ["Sol-Ré-Lá-Mi"], tps: ["Acústico Tradicional 4/4"] },
            { nome: "Violoncelo", afs: ["Dó-Sol-Ré-Lá"], tps: ["Tradicional 4/4", "Elétrico Silent"] },
            { nome: "Viola", afs: ["Dó-Sol-Ré-Lá"], tps: ["Sinfônica 4/4", "Infantil 2/4"] },
            { nome: "Piano", afs: ["La 440Hz"], tps: ["De Cauda", "Vertical"] },
            { nome: "Teclado", afs: ["Digital"], tps: ["Arranjador", "Sintetizador"] },
            { nome: "Trompa", afs: ["Fá", "Fá/Sib"], tps: ["Simples de Rotor", "Dupla Compensada"] },
            { nome: "Trombone", afs: ["Sib", "Fá"], tps: ["De Vara Clássico", "De Pisto/Valvulado"] },
            { nome: "Trompete", afs: ["Sib", "Dó"], tps: ["Pistos Tradicional", "Pocket"] },
            { nome: "Tuba", afs: ["Sib", "Fá"], tps: ["De Rotores Sinfônica"] },
            { nome: "Eufônio", afs: ["Sib"], tps: ["3 Pistos", "4 Pistões Compensado"] },
            { nome: "Bombardino", afs: ["Sib"], tps: ["Tradicional de Marcha"] },
            { nome: "Sousafone", afs: ["Sib"], tps: ["Fibra de Vidro (Leve)", "Latão Clássico"] },
            { nome: "Corneta", afs: ["Sib"], tps: ["Lisa Militar"] },
            { nome: "Saxofone", afs: ["Mib", "Sib"], tps: ["Alto", "Tenor", "Soprano"] }
        ];

        const container = document.getElementById('grid');
        insts.forEach(i => {
            container.innerHTML += `<div class="card-inst" onclick="focar('${i.nome}')"><i class="fa-solid fa-sliders"></i><h4>${i.nome}</h4></div>`;
        });

        function focar(nome) {
            const inst = insts.find(i => i.nome === nome);
            document.getElementById('painel-interativo').style.display = "block";
            document.getElementById('inst-nome').innerText = inst.nome;
            
            const selAf = document.getElementById('inst-afinacao'); selAf.innerHTML = inst.afs.map(a=>`<option>${a}</option>`).join('');
            const selTp = document.getElementById('inst-tipo'); selTp.innerHTML = inst.tps.map(t=>`<option>${t}</option>`).join('');
            
            const aviso = document.getElementById('aviso-proprio');
            // Regra de exceção: Violino e Trompete dispensam instrumento próprio
            if(nome === "Violino" || nome === "Trompete") {
                aviso.innerText = "✓ Infraestrutura: Instrumento de empréstimo disponível em laboratório.";
                aviso.style.color = "#39ff14";
            } else {
                aviso.innerText = "⚠️ REQUISITO CRÍTICO: É obrigatório possuir o instrumento físico próprio para as aulas semanais.";
                aviso.style.color = "#ff0055";
            }
        }
    </script>
</body>
</html>
