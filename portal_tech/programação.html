<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nexus - Software Engineering</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg-matrix: #030406; --panel-cyber: rgba(12, 15, 28, 0.95); --neon-green: #39ff14; --neon-blue: #00f0ff; --text-main: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg-matrix); color: var(--text-main); padding: 120px 8% 40px 8%; }
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.15; }
        nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(4,5,8,0.95); border-bottom: 1px solid rgba(0,240,255,0.15); display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--neon-blue); }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { color: #64748b; text-decoration: none; font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; }
        .nav-links a.active { color: var(--neon-blue); }
        .panel { background: var(--panel-cyber); border: 1px solid rgba(57,255,20,0.2); border-radius: 12px; padding: 40px; max-width: 650px; margin: 0 auto; box-shadow: 0 0 30px rgba(57,255,20,0.1); }
        h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-green); margin-bottom: 25px; font-size: 24px; text-transform: uppercase; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-family: 'Rajdhani', sans-serif; font-size: 14px; color: #64748b; text-transform: uppercase; }
        .form-group input, .form-group select { padding: 12px; background: #06080c; border: 1px solid rgba(255,255,255,0.08); color: white; border-radius: 6px; }
        .btn-submit { width: 100%; background: linear-gradient(90deg, var(--neon-green), #00aa00); color: black; border: none; padding: 15px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 15px; box-shadow: 0 0 15px var(--neon-green); }
    </style>
</head>
<body>
    <canvas id="canvas-rain"></canvas>
    <nav>
        <div class="logo">NEXUS.HUB</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="programação.html" class="active">Programação</a></li>
            <li><a href="música.html">Música</a></li>
            <li><a href="infraestrutura.html">Infraestrutura</a></li>
        </ul>
    </nav>

    <main class="panel">
        <h2>Ficha de Entrada Computacional</h2>
        <form onsubmit="alert('Pipeline Concluído: Dados de engenharia de software salvos em formato de planilha Excel.'); this.reset(); return false;">
            <div class="form-group"><label>Nome Completo</label><input type="text" required></div>
            <div class="form-group"><label>CPF</label><input type="text" required placeholder="000.000.000-00"></div>
            <div class="form-group"><label>Data de Nascimento</label><input type="date" required></div>
            <div class="form-group"><label>Endereço Operacional</label><input type="text" required></div>
            <div class="form-group">
                <label>Linguagem Core de Destino</label>
                <select id="lang"><option>Java</option><option>JavaScript</option><option>TypeScript</option><option>Python</option><option>C++</option></select>
            </div>
            <div class="form-group">
                <label>Foco de Engenharia</label>
                <select id="foco"><option>Desenvolvimento Web Fullstack</option><option>Arquitetura Backend</option><option>Engenharia Frontend</option><option>Resolução de Bugs em Sistemas Legados</option></select>
            </div>
            <div class="form-group">
                <label>Modo de Liquidação Fiscal</label>
                <select><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>PIX Automatizado</option></select>
            </div>
            <button type="submit" class="btn-submit">Consolidar Linha de Código</button>
        </form>
    </main>

    <script>
        const c = document.getElementById('canvas-rain'); const ctx = c.getContext('2d');
        function res() { c.width = window.innerWidth; c.height = window.innerHeight; }
        window.addEventListener('resize', res); res();
        const str = "0101010111001101ENGINE"; const f = 14; const col = c.width / f; const y = Array(Math.floor(col)).fill(1);
        function draw() { ctx.fillStyle = 'rgba(3,4,6,0.05)'; ctx.fillRect(0,0,c.width,c.height); ctx.fillStyle = '#39ff14'; ctx.font = f+'px monospace'; for(let i=0; i<y.length; i++) { const txt = str[Math.floor(Math.random()*str.length)]; ctx.fillText(txt, i*f, y[i]*f); if(y[i]*f > c.height && Math.random() > 0.975) y[i]=0; y[i]++; } }
        setInterval(draw, 33);
    </script>
</body>
</html>
