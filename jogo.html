<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Subway Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Arial', sans-serif; overflow: hidden; }
#game-container { position: relative; }
canvas { border: 3px solid #444; border-radius: 8px; background: #2d2d44; }
#hud { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
#gameover { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.85); padding: 30px 50px; border-radius: 12px; text-align: center; color: #fff; }
#gameover h2 { color: #ff4444; font-size: 32px; margin-bottom: 10px; }
#gameover p { font-size: 18px; margin: 5px 0; }
#gameover button { margin-top: 15px; padding: 10px 30px; font-size: 18px; background: #4CAF50; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
#gameover button:hover { background: #45a049; }
#start-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: #fff; }
#start-screen h1 { font-size: 42px; color: #FFD700; text-shadow: 3px 3px 6px rgba(0,0,0,0.8); margin-bottom: 10px; }
#start-screen p { font-size: 16px; margin: 8px 0; }
#start-screen button { margin-top: 20px; padding: 12px 40px; font-size: 20px; background: #FFD700; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
#start-screen button:hover { background: #e6c200; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="hud">Score: <span id="score">0</span> | Speed: <span id="speed">1</span>x</div>
  <div id="start-screen">
    <h1>🚇 SUBWAY RUNNER</h1>
    <p>⬅️➡️ Trocar de faixa</p>
    <p>⬆️ Pular</p>
    <p>⬇️ Deslizar</p>
    <button onclick="startGame()">JOGAR</button>
  </div>
  <div id="gameover">
    <h2>GAME OVER</h2>
    <p>Score: <span id="final-score">0</span></p>
    <p>Recorde: <span id="high-score">0</span></p>
    <button onclick="startGame()">JOGAR DE NOVO</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LANES = [100, 200, 300];
const LANE_W = 80;
const PLAYER_SIZE = 40;

let player, obstacles, score, speed, gameRunning, animFrame, lastTime, spawnTimer;
let highScore = 0;

function init() {
  player = { lane: 1, x: LANES[1], y: H - 100, jumping: false, sliding: false, jumpY: 0, slideTimer: 0 };
  obstacles = [];
  score = 0;
  speed = 1;
  spawnTimer = 0;
  lastTime = 0;
  gameRunning = true;
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover').style.display = 'none';
  init();
  if (animFrame) cancelAnimationFrame(animFrame);
  loop(0);
}

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  const type = Math.random() < 0.4 ? 'low' : 'high';
  obstacles.push({ lane, y: -60, type });
}

function update(dt) {
  speed = 1 + Math.floor(score / 500) * 0.5;
  score += Math.floor(dt * 60 * speed);
  document.getElementById('score').textContent = score;
  document.getElementById('speed').textContent = speed.toFixed(1);

  spawnTimer += dt;
  const spawnInterval = Math.max(0.4, 1.2 - speed * 0.15);
  if (spawnTimer >= spawnInterval) {
    spawnObstacle();
    if (Math.random() < 0.3) spawnObstacle();
    spawnTimer = 0;
  }

  const scrollSpeed = 4 * speed;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y += scrollSpeed;
    if (obstacles[i].y > H + 60) obstacles.splice(i, 1);
  }

  if (player.jumping) {
    player.jumpY += 12;
    if (player.jumpY >= 50) player.jumping = false;
    player.jumpY = Math.min(player.jumpY, 50);
  }
  if (player.sliding) {
    player.slideTimer -= dt;
    if (player.slideTimer <= 0) player.sliding = false;
  }

  // Collision
  for (let obs of obstacles) {
    if (obs.lane === player.lane) {
      const obsY = obs.y;
      const playerY = player.y - player.jumpY;
      if (Math.abs(obsY - playerY) < 35) {
        if (obs.type === 'high' && !player.sliding) return gameOver();
        if (obs.type === 'low' && !player.jumping) return gameOver();
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Track
  ctx.fillStyle = '#3a3a5c';
  ctx.fillRect(60, 0, 280, H);

  // Lane lines
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 15]);
  for (let i = 1; i < 3; i++) {
    const x = 60 + i * 100;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Side rails
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(55, 0, 5, H);
  ctx.fillRect(340, 0, 5, H);

  // Obstacles
  for (let obs of obstacles) {
    const x = LANES[obs.lane];
    if (obs.type === 'high') {
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(x - 30, obs.y - 15, 60, 30);
      ctx.fillStyle = '#cc0000';
      ctx.fillRect(x - 30, obs.y - 25, 60, 10);
      // "Slide under" indicator
      ctx.fillStyle = '#fff';
      ctx.font = '10px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('DESLIZE', x, obs.y + 5);
    } else {
      ctx.fillStyle = '#4488ff';
      ctx.fillRect(x - 30, obs.y - 10, 60, 20);
      ctx.fillStyle = '#fff';
      ctx.font = '10px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('PULE', x, obs.y + 5);
    }
  }

  // Player
  const px = player.x;
  const py = player.y - player.jumpY;
  const pw = player.sliding ? 50 : 30;
  const ph = player.sliding ? 20 : 40;

  ctx.fillStyle = player.jumping ? '#FFD700' : '#4CAF50';
  ctx.beginPath();
  ctx.roundRect(px - pw/2, py - ph/2, pw, ph, 6);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px - 7, py - 5, 5, 0, Math.PI * 2);
  ctx.arc(px + 7, py - 5, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px - 7, py - 5, 2, 0, Math.PI * 2);
  ctx.arc(px + 7, py - 5, 2, 0, Math.PI * 2);
  ctx.fill();

  // Shadow when jumping
  if (player.jumping) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px, player.y + 15, 20, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop(time) {
  if (!gameRunning) return;
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  update(dt);
  if (gameRunning) {
    draw();
    animFrame = requestAnimationFrame(loop);
  }
}

function gameOver() {
  gameRunning = false;
  document.getElementById('final-score').textContent = score;
  if (score > highScore) highScore = score;
  document.getElementById('high-score').textContent = highScore;
  document.getElementById('gameover').style.display = 'block';
}

document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  switch (e.key) {
    case 'ArrowLeft': case 'a': case 'A':
      if (player.lane > 0) player.lane--;
      player.x = LANES[player.lane];
      break;
    case 'ArrowRight': case 'd': case 'D':
      if (player.lane < 2) player.lane++;
      player.x = LANES[player.lane];
      break;
    case 'ArrowUp': case 'w': case 'W':
      if (!player.jumping) { player.jumping = true; player.jumpY = 0; }
      break;
    case 'ArrowDown': case 's': case 'S':
      if (!player.sliding) { player.sliding = true; player.slideTimer = 0.5; }
      break;
  }
});
</script>
</body>
</html>
