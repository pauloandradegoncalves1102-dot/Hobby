<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa – Navegador de Rotas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --bg-dark: #f8f9fa;
            --border: #e0e0e0;
            --text: #202124;
            --text-secondary: #5f6368;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --shadow: 0 2px 10px rgba(0,0,0,0.15);
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Barra superior ── */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: var(--bg);
            box-shadow: var(--shadow);
            z-index: 1000;
            gap: 12px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 580px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 10px 40px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 0.9rem;
            outline: none;
            background: var(--bg);
            transition: box-shadow 0.2s;
        }

        .search-container input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: transparent;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .search-btn:hover { background: var(--primary-hover); }

    
        .panel {
            position: absolute;
            top: 60px;
            left: 12px;
            width: 320px;
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 999;
            display: none;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .panel.active { display: block; }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }

        .panel-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
        }

        .panel-body { padding: 12px 16px; }

        .route-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .route-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .route-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .route-dot.origin { background: #34a853; }
        .route-dot.dest { background: #ea4335; }

        .route-input-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .route-input-row input:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-dark); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }

        .route-info {
            margin-top: 12px;
            padding: 12px;
            background: var(--bg-dark);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .route-info .duration {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .route-info .distance {
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .search-results {
            list-style: none;
        }

        .search-results li {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: background 0.1s;
        }

        .search-results li:hover { background: var(--bg-dark); }
        .search-results li:last-child { border-bottom: none; }

        .search-results .icon {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .search-results .name {
            font-weight: 500;
            color: var(--text);
        }

        .search-results .address {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

    
        .map-controls {
            position: absolute;
            right: 12px;
            top: 60px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .map-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg);
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .map-btn:hover { background: var(--bg-dark); }
        .map-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        
        #map {
            flex: 1;
            z-index: 1;
        }

       
        .status-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.78rem;
            z-index: 999;
            display: none;
        }

        .status-bar.visible { display: block; }

       
        @media (max-width: 600px) {
            .panel { width: calc(100% - 24px); left: 12px; }
            .logo { display: none; }
        }
    </style>
</head>
<body>


<div class="top-bar">
    <span class="logo">🗺️ Mapa</span>
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Pesquisar endereço, cidade ou local..." autocomplete="off">
        <button class="search-btn" onclick="buscar()" title="Pesquisar">→</button>
    </div>
    <button class="btn btn-secondary" onclick="abrirPainelRota()" style="white-space:nowrap;">📍 Rotas</button>
</div>


<div class="panel" id="panelRota">
    <div class="panel-header">
        <h3>Planejar rota</h3>
        <button class="panel-close" onclick="fecharPainel('panelRota')">✕</button>
    </div>
    <div class="panel-body">
        <div class="route-inputs">
            <div class="route-input-row">
                <div class="route-dot origin"></div>
                <input type="text" id="inputOrigem" placeholder="Origem (endereço)">
            </div>
            <div class="route-input-row">
                <div class="route-dot dest"></div>
                <input type="text" id="inputDestino" placeholder="Destino (endereço)">
            </div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="calcularRota()">Calcular rota</button>
            <button class="btn btn-secondary" onclick="usarMinhaLocalizacao()">📍 Minha localização</button>
        </div>
        <div class="route-info" id="routeInfo" style="display:none;">
            <div class="duration" id="routeDuration"></div>
            <div class="distance" id="routeDistance"></div>
        </div>
    </div>
</div>


<div class="panel" id="panelResultados" style="top: 60px; left: 12px;">
    <div class="panel-header">
        <h3>Resultados</h3>
        <button class="panel-close" onclick="fecharPainel('panelResultados')">✕</button>
    </div>
    <div class="panel-body">
        <ul class="search-results" id="searchResults"></ul>
    </div>
</div>

<div class="map-controls">
    <button class="map-btn" onclick="zoomIn()" title="Aproximar">+</button>
    <button class="map-btn" onclick="zoomOut()" title="Afastar">−</button>
    <button class="map-btn" onclick="usarMinhaLocalizacao()" title="Minha localização">📍</button>
    <button class="map-btn" onclick="mudarCamada()" id="btnCamada" title="Mudar camada">🗺️</button>
    <button class="map-btn" onclick="centralizarBrasil()" title="Centralizar no Brasil">🇧🇷</button>
</div>


<div class="status-bar" id="statusBar"></div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>


let camadaAtual = 0;
let rotaLayer = null;
let marcadorOrigem = null;
let marcadorDestino = null;
let marcadorLocalizacao = null;

const camadas = [
    {
        nome: "Mapa",
        url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    },
    {
        nome: "Satélite",
        url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        attribution: '&copy; Esri, Maxar, Earthstar Geographics'
    },
    {
        nome: "Terreno",
        url: "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        attribution: '&copy; OpenTopoMap (CC-BY-SA)'
    }
];


const mapa = L.map('map', {
    center: [-14.2350, -51.9253], 
    zoom: 5,
    zoomControl: false
});

let tileLayer = L.tileLayer(camadas[0].url, {
    attribution: camadas[0].attribution,
    maxZoom: 19
}).addTo(mapa);


function zoomIn() { mapa.zoomIn(); }
function zoomOut() { mapa.zoomOut(); }

function centralizarBrasil() {
    mapa.flyTo([-14.2350, -51.9253], 5, { duration: 1 });
}

function mudarCamada() {
    camadaAtual = (camadaAtual + 1) % camadas.length;
    mapa.removeLayer(tileLayer);
    tileLayer = L.tileLayer(camadas[camadaAtual].url, {
        attribution: camadas[camadaAtual].attribution,
        maxZoom: 19
    }).addTo(mapa);
    document.getElementById("btnCamada").textContent =
        camadaAtual === 0 ? "🗺️" : camadaAtual === 1 ? "🛰️" : "⛰️";
    mostrarStatus(`Camada: ${camadas[camadaAtual].nome}`);
}

function usarMinhaLocalizacao() {
    mostrarStatus("Obtendo localização...");
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            if (marcadorLocalizacao) mapa.removeLayer(marcadorLocalizacao);
            marcadorLocalizacao = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: '',
                    html: '<div style="width:16px;height:16px;background:#1a73e8;border:3px solid white;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,0.3);"></div>',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                })
            }).addTo(mapa).bindPopup("Sua localização");
            mapa.flyTo([lat, lng], 15, { duration: 1 });
            ocultarStatus();
        },
        () => {
            mostrarStatus("❌ Não foi possível obter sua localização.");
            setTimeout(ocultarStatus, 3000);
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}



document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") buscar();
});

async function buscar() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return;

    mostrarStatus("Buscando...");
    try {
        const resp = await fetch(
            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&accept-language=pt-BR`,
            { headers: { "User-Agent": "MapaLocal/1.0" } }
        );
        const results = await resp.json();
        ocultarStatus();

        if (results.length === 0) {
            mostrarStatus("Nenhum resultado encontrado.");
            setTimeout(ocultarStatus, 3000);
            return;
        }

        const ul = document.getElementById("searchResults");
        ul.innerHTML = "";
        results.forEach((r) => {
            const li = document.createElement("li");
            li.innerHTML = `
                <span class="icon">📍</span>
                <div>
                    <div class="name">${r.display_name.split(",").slice(0, 2).join(",")}</div>
                    <div class="address">${r.display_name.split(",").slice(2, 5).join(",")}</div>
                </div>
            `;
            li.onclick = () => {
                const lat = parseFloat(r.lat);
                const lng = parseFloat(r.lon);
                mapa.flyTo([lat, lng], 15, { duration: 1 });
                L.marker([lat, lng]).addTo(mapa)
                    .bindPopup(r.display_name)
                    .openPopup();
                fecharPainel("panelResultados");
            };
            ul.appendChild(li);
        });

        document.getElementById("panelResultados").classList.add("active");
    } catch (e) {
        ocultarStatus();
        mostrarStatus("Erro na busca. Tente novamente.");
        setTimeout(ocultarStatus, 3000);
    }
}


function abrirPainelRota() {
    document.getElementById("panelRota").classList.add("active");
    document.getElementById("panelResultados").classList.remove("active");
}

function fecharPainel(id) {
    document.getElementById(id).classList.remove("active");
}

async function geocode(endereco) {
    const resp = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(endereco)}&format=json&limit=1&accept-language=pt-BR`,
        { headers: { "User-Agent": "MapaLocal/1.0" } }
    );
    const results = await resp.json();
    if (results.length === 0) return null;
    return { lat: parseFloat(results[0].lat), lon: parseFloat(results[0].lon) };
}

async function calcularRota() {
    const origemTxt = document.getElementById("inputOrigem").value.trim();
    const destinoTxt = document.getElementById("inputDestino").value.trim();
    if (!origemTxt || !destinoTxt) {
        mostrarStatus("Preencha origem e destino.");
        setTimeout(ocultarStatus, 2000);
        return;
    }

    mostrarStatus("Calculando rota...");
    try {
        const origem = await geocode(origemTxt);
        if (!origem) { mostrarStatus("Origem não encontrada."); setTimeout(ocultarStatus, 3000); return; }
        await new Promise(r => setTimeout(r, 1100));
        const destino = await geocode(destinoTxt);
        if (!destino) { mostrarStatus("Destino não encontrado."); setTimeout(ocultarStatus, 3000); return; }

        const url = `https://router.project-osrm.org/route/v1/driving/${origem.lon},${origem.lat};${destino.lon},${destino.lat}?overview=full&geometries=geojson&steps=true`;
        const resp = await fetch(url);
        const data = await resp.json();

        if (data.code !== "Ok") {
            mostrarStatus("Não foi possível calcular a rota.");
            setTimeout(ocultarStatus, 3000);
            return;
        }

        const rota = data.routes[0];
        const coords = rota.geometry.coordinates.map(c => [c[1], c[0]]);

        
        if (rotaLayer) mapa.removeLayer(rotaLayer);
        if (marcadorOrigem) mapa.removeLayer(marcadorOrigem);
        if (marcadorDestino) mapa.removeLayer(marcadorDestino);

        
        rotaLayer = L.polyline(coords, {
            color: "#1a73e8",
            weight: 4,
            opacity: 0.8,
            lineCap: "round"
        }).addTo(mapa);

       
        marcadorOrigem = L.marker(coords[0], {
            icon: L.divIcon({
                className: '',
                html: '<div style="width:24px;height:24px;background:#34a853;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:bold;">A</div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            })
        }).addTo(mapa).bindPopup("Origem");

        marcadorDestino = L.marker(coords[coords.length - 1], {
            icon: L.divIcon({
                className: '',
                html: '<div style="width:24px;height:24px;background:#ea4335;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:bold;">B</div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            })
        }).addTo(mapa).bindPopup("Destino");

        
        const bounds = L.latLngBounds(coords);
        mapa.flyToBounds(bounds, { padding: [50, 50], duration: 1 });
        const durMin = Math.round(rota.duration / 60);
        const distKm = (rota.distance / 1000).toFixed(1);
        document.getElementById("routeDuration").textContent = `${durMin} min`;
        document.getElementById("routeDistance").textContent = `${distKm} km`;
        document.getElementById("routeInfo").style.display = "block";

        ocultarStatus();
    } catch (e) {
        ocultarStatus();
        mostrarStatus("Erro ao calcular rota.");
        setTimeout(ocultarStatus, 3000);
    }
}

function mostrarStatus(msg) {
    const bar = document.getElementById("statusBar");
    bar.textContent = msg;
    bar.classList.add("visible");
}

function ocultarStatus() {
    document.getElementById("statusBar").classList.remove("visible");
}
</script>

</body>
</html>
